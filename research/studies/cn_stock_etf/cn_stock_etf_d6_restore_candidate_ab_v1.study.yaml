study_id: cn_stock_etf/cn_stock_etf_d6_restore_candidate_ab_v1
title: CN Stock ETF D6 Restore Candidate AB V1
asset_scope: cn_a_equity
baseline_id: CN_STOCK_ETF_COMBO_BASELINE_V3
hypothesis: >
  Some D5 half-exit positions later re-enter the raw stock entry candidate set,
  but the provider held-position filter prevents them from being restored. This
  study tests whether explicit restore_candidate top-ups improve the stock leg
  inside the unified stock+ETF combo runtime.
change_scope:
  modules_modified:
    - strategy.params.enable_mfe_mae_confirmation_exit
    - strategy.params.mfe_mae_confirmation_scope
    - strategy.params.mfe_mae_confirmation_action
    - strategy.params.mfe_mae_confirmation_lookahead_bars
    - strategy.params.mfe_mae_confirmation_min_mfe_pct
    - strategy.params.mfe_mae_confirmation_max_mae_pct
    - strategy.params.mfe_mae_confirmation_exit_pct
    - strategy.params.enable_mfe_mae_restore_candidate
    - strategy.params.mfe_mae_restore_candidate_scope
    - strategy.params.mfe_mae_restore_candidate_max_bars
    - strategy.params.mfe_mae_restore_candidate_target_basis
    - strategy.params.mfe_mae_restore_candidate_clear_on_fill
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - ranking
    - entry_rules
    - d5_failure_thresholds
    - execution_clock
    - costs
    - etf_sleeve
    - account_allocator
    - combo_nav_assembly
variants:
  - name: B0_COMBO_V3_REPLAY
    description: Replay the V3 stock+ETF combo template with no D5 restore change.
  - name: HC_D5_IMMEDIATE_COMBO
    description: High-chase day3 D5 failure with MAE <= -5% exits half immediately; restore disabled.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: exit
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.05
          mfe_mae_confirmation_exit_pct: 0.5
          enable_mfe_mae_restore_candidate: false
  - name: HC_D5_IMMEDIATE_RESTORE_COMBO
    description: Same D5 half exit, then restore top-up when the same symbol re-enters raw candidates while still half-held.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: exit
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.05
          mfe_mae_confirmation_exit_pct: 0.5
          enable_mfe_mae_restore_candidate: true
          mfe_mae_restore_candidate_scope: high_chase
          mfe_mae_restore_candidate_max_bars: 40
          mfe_mae_restore_candidate_target_basis: original_target
          mfe_mae_restore_candidate_clear_on_fill: true
windows:
  - key: "1626"
    role: main
    start: "2016-01-01"
    end: "2026-05-08"
  - key: "1217"
    role: guardrail
    start: "2012-01-04"
    end: "2017-12-29"
  - key: "1226"
    role: full_audit
    start: "2012-01-04"
    end: "2026-05-08"
hard_gates:
  min_trades: 1
required_outputs:
  - machine_bundle
  - human_bundle
  - study_conclusion
request_template:
  config_path: backend/configs/pams_cn_pg.json
  fast_mode: true
  runner_params:
    combo_template_path: outputs/baselines/CN_STOCK_ETF_COMBO_BASELINE_V3/config.json
    stock_runtime_config_path: outputs/experiments/exp_20260510_033603951_8649/run_config.json
    etf_runtime_config_path: outputs/experiments/exp_20260510_034150821_8962/run_config.json
    source_stock_component_exp_id: exp_20260510_033603951_8649
metadata:
  runner_mode: cn_stock_etf_stock_rule_combo_ab
  research_only: true
  docker_required: true
  source_combo_baseline_id: CN_STOCK_ETF_COMBO_BASELINE_V3
  source_stock_component_exp_id: exp_20260510_033603951_8649
  source_etf_component_exp_id: exp_20260510_034150821_8962
  same_window_compare_required: true
  nav_truth: unified_runtime_combo_nav
  precomputed_component_results_allowed: false
  primary_variable: d5_restore_candidate_top_up
