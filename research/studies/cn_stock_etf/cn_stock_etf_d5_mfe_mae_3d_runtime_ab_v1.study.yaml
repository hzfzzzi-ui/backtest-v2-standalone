study_id: cn_stock_etf/cn_stock_etf_d5_mfe_mae_3d_runtime_ab_v1
title: CN Stock ETF D5 MFE/MAE 3D Runtime AB V1
asset_scope: cn_a_equity
baseline_id: baseline_V10_1
hypothesis: >
  A real runtime 3-day post-entry MFE/MAE confirmation exit may cut low-quality
  failed breakouts and free capital, but it must be validated through the normal
  stock runtime because the prior D5 shadow did not model re-entry or capital reuse.
change_scope:
  modules_modified:
    - strategy.params.enable_mfe_mae_confirmation_exit
    - strategy.params.mfe_mae_confirmation_lookahead_bars
    - strategy.params.mfe_mae_confirmation_min_mfe_pct
    - strategy.params.mfe_mae_confirmation_max_mae_pct
    - strategy.params.mfe_mae_confirmation_exit_pct
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - ranking
    - entry_rules
    - execution
    - costs
    - sizing
    - etf_sleeve
variants:
  - name: B0_V3_STOCK_REPLAY
    description: Same-runtime stock-leg replay from the latest V3 stock component runtime config.
  - name: D5_3D_MFE_MAE_RUNTIME_HALF_EXIT
    description: Enable runtime 3-day MFE/MAE confirmation failure half-exit.
    request_overrides:
      runtime_config_json:
        strategy:
          params:
            enable_mfe_mae_confirmation_exit: true
            mfe_mae_confirmation_lookahead_bars: 3
            mfe_mae_confirmation_min_mfe_pct: 0.02
            mfe_mae_confirmation_max_mae_pct: -0.05
            mfe_mae_confirmation_exit_pct: 0.5
windows:
  - key: "1626"
    role: main
    start: "2016-01-01"
    end: "2026-05-08"
  - key: "1217"
    role: guardrail
    start: "2012-01-04"
    end: "2017-12-29"
  - key: "1226"
    role: full_audit
    start: "2012-01-04"
    end: "2026-05-08"
hard_gates:
  min_trades: 1
required_outputs:
  - machine_bundle
  - human_bundle
  - study_conclusion
request_template:
  config_path: backend/configs/pams_cn_pg.json
  runtime_config_path: outputs/experiments/exp_20260510_033603951_8649/run_config.json
  fast_mode: true
  initial_capital: 1000000
  enable_multifactor_rank: true
  momentum_top_pct: 0.0
  universe_mode: HS300_ZZ500
  price_adj: hfq
metadata:
  research_only: true
  primary_variable: d5_mfe_mae_confirmation_exit_3d
  docker_required: true
  source_stock_component_exp_id: exp_20260510_033603951_8649
  source_combo_baseline_id: CN_STOCK_ETF_COMBO_BASELINE_V3
  source_shadow_study_id: cn_stock_etf/sr_20260511_v3_d5_mfe_mae_confirmation_shadow
  same_window_compare_required: true
  industry_or_theme_inputs: false
