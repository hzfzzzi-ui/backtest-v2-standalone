study_id: cn_stock_etf/cn_stock_risk_archetype_soft_deprioritize_ab_v1
title: CN Stock Risk Archetype Soft Deprioritize AB V1
asset_scope: cn_a_equity
baseline_id: baseline_V10_1
hypothesis: >
  Hot/crowded and high-volatility chase candidates may be lower-quality signals,
  but the executable test should only move them back in the same-day ranking
  instead of blocking them.
change_scope:
  modules_modified:
    - strategy.params.risk_archetype_soft_deprioritize_enabled
    - strategy.params.risk_archetype_soft_deprioritize_quantile
    - strategy.params.risk_archetype_hot_crowded_penalty
    - strategy.params.risk_archetype_high_volatility_penalty
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - universe.filters
    - entry_rules
    - execution_timing
    - exit_rules
    - costs
    - sizing
    - etf_leg
    - combo_allocator
variants:
  - name: B0_V4_STOCK_REPLAY
    description: Same-runtime replay of the current V4 stock-leg rule set.
  - name: RISK_ARCHETYPE_SOFT_Q80_H20_V15
    description: >
      Deprioritize hot/crowded candidates by 20% and high-volatility chase
      candidates by 15% when they rank in the top 20% of same-day buy candidates.
    request_overrides:
      runtime_config_json:
        strategy:
          params:
            risk_archetype_soft_deprioritize_enabled: true
            risk_archetype_soft_deprioritize_quantile: 0.80
            risk_archetype_hot_crowded_penalty: 0.20
            risk_archetype_high_volatility_penalty: 0.15
windows:
  - key: "1626"
    role: main
    start: "2016-01-01"
    end: "2026-05-12"
  - key: "1217"
    role: guardrail
    start: "2012-01-04"
    end: "2017-12-29"
  - key: "1226"
    role: full_audit
    start: "2012-01-04"
    end: "2026-05-12"
