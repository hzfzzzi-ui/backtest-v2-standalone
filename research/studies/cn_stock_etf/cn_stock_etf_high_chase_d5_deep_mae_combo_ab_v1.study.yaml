study_id: cn_stock_etf/cn_stock_etf_high_chase_d5_deep_mae_combo_ab_v1
title: CN Stock ETF High Chase D5 Deep MAE Combo AB V1
asset_scope: cn_a_equity
baseline_id: CN_STOCK_ETF_COMBO_BASELINE_V3
hypothesis: >
  The recent D5 underperformance may come from treating deep early MAE as an
  immediate failure. This study isolates mild versus deep High Chase D5 failures
  and compares immediate exit, deep-only exit, and day10 watch actions in the
  unified stock+ETF combo runtime.
change_scope:
  modules_modified:
    - research_entry.cn_stock_etf.high_chase_d5_deep_mae_combo_ab_v1
    - strategy.params.enable_mfe_mae_confirmation_exit
    - strategy.params.mfe_mae_confirmation_scope
    - strategy.params.mfe_mae_confirmation_action
    - strategy.params.mfe_mae_confirmation_lookahead_bars
    - strategy.params.mfe_mae_confirmation_min_mfe_pct
    - strategy.params.mfe_mae_confirmation_max_mae_pct
    - strategy.params.mfe_mae_confirmation_exit_pct
    - strategy.params.mfe_mae_watch_review_bars
    - strategy.params.mfe_mae_watch_review_min_mfe_pct
    - strategy.params.mfe_mae_watch_review_max_current_return_pct
    - strategy.params.mfe_mae_watch_review_max_mae_pct
    - strategy.params.mfe_mae_watch_deep_mae_immediate_pct
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - ranking
    - entry_rules
    - execution
    - costs
    - etf_sleeve
    - account_allocator
    - combo_nav_assembly
variants:
  - name: B0_COMBO_V3_REPLAY
    description: Replay the V3 stock+ETF combo template with stock and ETF component runtime configs refreshed only by window bounds.
  - name: HC_D5_IMMEDIATE_COMBO
    description: High-chase day3 D5 failure with MAE <= -5% exits immediately.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: exit
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.05
          mfe_mae_confirmation_exit_pct: 0.5
  - name: HC_D5_DEEP_ONLY_IMMEDIATE_COMBO
    description: Only high-chase day3 D5 failures with MAE <= -8% exit immediately; mild -5% to -8% failures are ignored.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: exit
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.08
          mfe_mae_confirmation_exit_pct: 0.5
  - name: HC_D5_MILD_WATCH_DEEP_IMMEDIATE_DAY10_COMBO
    description: Mild high-chase D5 failures enter day10 watch; deep MAE <= -8% still exits immediately.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: watch_day10
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.05
          mfe_mae_confirmation_exit_pct: 0.5
          mfe_mae_watch_review_bars: 10
          mfe_mae_watch_review_min_mfe_pct: 0.02
          mfe_mae_watch_review_max_current_return_pct: 0.0
          mfe_mae_watch_review_max_mae_pct: -0.05
          mfe_mae_watch_deep_mae_immediate_pct: -0.08
  - name: HC_D5_DEEP_ONLY_WATCH_DAY10_COMBO
    description: Only deep high-chase D5 failures with MAE <= -8% enter day10 watch; mild failures are ignored.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: watch_day10
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.08
          mfe_mae_confirmation_exit_pct: 0.5
          mfe_mae_watch_review_bars: 10
          mfe_mae_watch_review_min_mfe_pct: 0.02
          mfe_mae_watch_review_max_current_return_pct: 0.0
          mfe_mae_watch_review_max_mae_pct: -0.08
          mfe_mae_watch_deep_mae_immediate_pct: -1.0
  - name: HC_D5_ALL_WATCH_DAY10_COMBO
    description: All high-chase D5 failures with MAE <= -5% enter day10 watch, including deep failures.
    request_overrides:
      runner_params:
        stock_runtime_param_patch:
          enable_mfe_mae_confirmation_exit: true
          mfe_mae_confirmation_scope: high_chase
          mfe_mae_confirmation_action: watch_day10
          mfe_mae_confirmation_lookahead_bars: 3
          mfe_mae_confirmation_min_mfe_pct: 0.02
          mfe_mae_confirmation_max_mae_pct: -0.05
          mfe_mae_confirmation_exit_pct: 0.5
          mfe_mae_watch_review_bars: 10
          mfe_mae_watch_review_min_mfe_pct: 0.02
          mfe_mae_watch_review_max_current_return_pct: 0.0
          mfe_mae_watch_review_max_mae_pct: -0.05
          mfe_mae_watch_deep_mae_immediate_pct: -1.0
