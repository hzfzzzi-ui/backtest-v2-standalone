study_id: cn_stock_etf/cn_stock_entry_risk_position_sizing_ab_v1
title: CN Stock Entry Risk Position Sizing AB V1
asset_scope: cn_a_equity
baseline_id: baseline_V10_1
hypothesis: >
  Entry-time risk archetype flags may identify lower-quality breakout buys. The
  executable test should reduce buy size only, leaving selection, ranking, exits,
  fills, costs, universe, and NAV accounting unchanged.
change_scope:
  modules_modified:
    - strategy.params.entry_risk_position_sizing_enabled
    - strategy.params.entry_risk_position_watch_scale
    - strategy.params.entry_risk_position_high_scale
    - strategy.params.entry_risk_position_extreme_scale
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - universe.filters
    - entry_rules
    - ranking
    - execution_timing
    - exit_rules
    - costs
    - etf_leg
    - combo_allocator
variants:
  - name: B0_V4_STOCK_REPLAY
    description: Same-runtime replay of the current V4 stock-leg rule set.
  - name: ENTRY_RISK_POSITION_SIZING_Q80_W80_H50_X33
    description: >
      Keep the same candidates and exits, but size normal buys by risk-archetype
      tier: 0 flags 100%, 1 flag 80%, 2 flags 50%, 3+ flags 33.33%.
    request_overrides:
      runtime_config_json:
        strategy:
          params:
            entry_risk_position_sizing_enabled: true
            entry_risk_position_watch_scale: 0.80
            entry_risk_position_high_scale: 0.50
            entry_risk_position_extreme_scale: 0.3333333333
windows:
  - key: "1626"
    role: main
    start: "2016-01-01"
    end: "2026-05-12"
  - key: "1217"
    role: guardrail
    start: "2012-01-04"
    end: "2017-12-29"
  - key: "1226"
    role: full_audit
    start: "2012-01-04"
    end: "2026-05-12"
hard_gates:
  min_trades: 1
required_outputs:
  - machine_bundle
  - human_bundle
  - study_conclusion
request_template:
  config_path: backend/configs/pams_cn_pg.json
  runtime_config_path: outputs/experiments/exp_20260513_025957649_4f17/run_config.json
  fast_mode: true
  initial_capital: 1000000
  enable_multifactor_rank: true
