study_id: cn_stock_etf/cn_stock_etf_b1_runtime_replacement_ab_v1
title: CN Stock ETF B1 Runtime Replacement AB V1
asset_scope: cn_a_equity
baseline_id: baseline_V10_1
hypothesis: >
  A real runtime replacement control can reduce cash-blocked missed opportunities by swapping
  weak held stocks for stronger current candidates, but it must be validated through the
  normal stock runtime before any combo-level or theme-protected promotion.
change_scope:
  modules_modified:
    - sizing.rotation_replace_enabled
    - sizing.rotation_replace_only_strong_risk_on
    - sizing.rotation_replace_max_swaps_per_day
    - sizing.rotation_replace_candidate_top_n
    - sizing.rotation_replace_min_score_gap
  fixed_modules:
    - universe.universe_mode
    - strategy.params
    - ranking
    - entry_rules
    - exit_rules
    - execution
    - costs
    - etf_sleeve
variants:
  - name: B0_V3_STOCK_REPLAY
    description: Same-runtime stock-leg replay from the latest V3 stock component runtime config.
  - name: B1_RUNTIME_REPLACE_CONTROL
    description: Enable the existing runtime score-gap rotation replacement control.
    request_overrides:
      runtime_config_json:
        sizing:
          rotation_replace_enabled: true
          rotation_replace_only_strong_risk_on: true
          rotation_replace_max_swaps_per_day: 1
          rotation_replace_candidate_top_n: 3
          rotation_replace_min_score_gap: 0.15
windows:
  - key: "1626"
    role: main
    start: "2016-01-01"
    end: "2026-05-08"
  - key: "1217"
    role: guardrail
    start: "2012-01-04"
    end: "2017-12-29"
  - key: "1226"
    role: full_audit
    start: "2012-01-04"
    end: "2026-05-08"
hard_gates:
  min_trades: 1
required_outputs:
  - machine_bundle
  - human_bundle
  - study_conclusion
request_template:
  config_path: backend/configs/pams_cn_pg.json
  runtime_config_path: outputs/experiments/exp_20260510_033603951_8649/run_config.json
  fast_mode: true
  initial_capital: 1000000
  enable_multifactor_rank: true
  momentum_top_pct: 0.0
  universe_mode: HS300_ZZ500
  price_adj: hfq
metadata:
  research_only: true
  primary_variable: runtime_replacement_control
  docker_required: true
  source_stock_component_exp_id: exp_20260510_033603951_8649
  source_combo_baseline_id: CN_STOCK_ETF_COMBO_BASELINE_V3
  same_window_compare_required: true
  exact_theme_protected_runtime_b1: false
