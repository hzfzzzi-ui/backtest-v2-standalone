      runner_params:
        etf_source:
          mode: current_formal_combo_template
          pool_version: current_formal_combo_template
  - name: FORMAL_POOL_ROTATION_CONTROL
    description: Formal ETF pool under the same standalone rotation contract used by the ETF expansion studies.
    request_overrides:
      runner_params:
        etf_source:
          mode: etf_study_variant
          study_id: etf/cn_etf_formal_pool_rotation_control_v1
          variant_name: FORMAL_POOL_ROTATION_CONTROL
          pool_version: formal_etf_pool_v1_rotation_control
