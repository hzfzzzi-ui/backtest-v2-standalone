study_id: cn_stock_etf/cn_stock_etf_expanded_pool_shadow_v1
title: CN Stock ETF Expanded Pool Shadow V1
asset_scope: cn_a_equity
baseline_id: CN_STOCK_ETF_FORMAL_V1
hypothesis: Expanded ETF pools must still improve the stock+ETF combo after the A-share stock sleeve is held fixed and only the ETF sleeve source is changed.
change_scope:
