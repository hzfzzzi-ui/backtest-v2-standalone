          study_id: etf/cn_etf_research_realworld_pool_v1
          variant_name: REALWORLD_POOL_V1
          pool_version: cn_etf_research_realworld_pool_v1
  - name: INDUSTRY_THEME_POOL_V2
    description: Industry/theme ETF research pool in stock+ETF combo context.
    request_overrides:
      runner_params:
        etf_source:
          mode: etf_study_variant
