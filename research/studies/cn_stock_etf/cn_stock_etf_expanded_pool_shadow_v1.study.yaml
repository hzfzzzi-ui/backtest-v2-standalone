          variant_name: INDUSTRY_THEME_POOL_V2
          pool_version: cn_etf_research_industry_theme_pool_v2
  - name: STYLE_SMART_BETA_POOL_V2
    description: Style and smart-beta ETF research pool in stock+ETF combo context.
    request_overrides:
      runner_params:
        etf_source:
          mode: etf_study_variant
          study_id: etf/cn_etf_research_style_smart_beta_pool_v2
          variant_name: STYLE_SMART_BETA_POOL_V2
          pool_version: cn_etf_research_style_smart_beta_pool_v2
