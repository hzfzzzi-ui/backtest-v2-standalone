            score_source: fundamental_quality_v1
  - name: Q_SOFT_WEIGHT_50_150
    description: Keep candidate ordering and aggressively tilt selected order sizing from 0.50x to 1.50x by quality.
    request_overrides:
      runtime_config_json:
        sizing:
          weight_mode: score_weighted
          score_weight_min_scale: 0.50
          score_weight_max_scale: 1.50
        asset_context:
          moneyflow_overlay:
