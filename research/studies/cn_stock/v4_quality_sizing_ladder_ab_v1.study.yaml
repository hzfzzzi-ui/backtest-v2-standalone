hard_gates:
  min_trades: 1
required_outputs:
  - machine_bundle
  - human_bundle
  - study_conclusion
request_template:
  config_path: backend/configs/pams_cn_pg.json
  runtime_config_path: outputs/baselines/baseline_V10_1/run_config.json
  fast_mode: true
  initial_capital: 1000000
  enable_multifactor_rank: true
  momentum_top_pct: 0.0
  universe_mode: HS300_ZZ500
  price_adj: hfq
metadata:
  research_only: true
  primary_variable: fundamental_quality_soft_sizing_band
  docker_required: true
  stock_only: true
  etf_or_combo_inputs: false
  industry_or_theme_inputs: false
  source_baseline_id: baseline_V10_1
  source_quality_audit: outputs/studies/cn_stock/v4_quality_q0_q1_audit_v1/report.md
