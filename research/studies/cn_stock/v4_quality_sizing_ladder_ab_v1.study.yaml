study_id: cn_stock/v4_quality_sizing_ladder_ab_v1
title: V4 fundamental quality sizing ladder AB v1
asset_scope: cn_a_equity
baseline_id: baseline_V10_1
hypothesis: >
  PIT-safe fundamental quality is more useful as a concentration/sizing
  assistant than as a hard filter. Test whether quality sizing improvement is
  robust across conservative, medium, and wide sizing bands.
change_scope:
  modules_modified:
    - runtime_config_json.sizing.weight_mode
    - runtime_config_json.asset_context.moneyflow_overlay
  fixed_modules:
    - universe.universe_mode
    - universe.membership_mode
    - strategy.entry_rules
    - strategy.exit_rules
    - candidate_ordering
    - market_state
    - execution
    - costs
variants:
  - name: B0_V4_STOCK_REPLAY
    description: Same-runtime V4 stock-leg replay without quality sizing.
  - name: Q_SOFT_WEIGHT_85_115
    description: Keep candidate ordering and tilt selected order sizing from 0.85x to 1.15x by quality.
    request_overrides:
      runtime_config_json:
        sizing:
          weight_mode: score_weighted
          score_weight_min_scale: 0.85
          score_weight_max_scale: 1.15
        asset_context:
          moneyflow_overlay:
            enabled: true
            source_kind: daily_factor_snapshot
            factor_snapshot_path: outputs/studies/cn_stock/v4_fundamental_quality_ranking_ab_v1/snapshots/fundamental_quality_daily_snapshot.csv
            factor_id: fundamental_quality_v1
            score_field: quality_score
            lower_is_better: false
            date_column: date
            symbol_column: symbol
            available_column: available
            mode: soft_weight
            factor_role: context
            apply_layer: candidate
            score_source: fundamental_quality_v1
  - name: Q_SOFT_WEIGHT_80_120
    description: Keep candidate ordering and tilt selected order sizing from 0.80x to 1.20x by quality.
    request_overrides:
      runtime_config_json:
        sizing:
          weight_mode: score_weighted
          score_weight_min_scale: 0.80
          score_weight_max_scale: 1.20
        asset_context:
          moneyflow_overlay:
            enabled: true
            source_kind: daily_factor_snapshot
            factor_snapshot_path: outputs/studies/cn_stock/v4_fundamental_quality_ranking_ab_v1/snapshots/fundamental_quality_daily_snapshot.csv
            factor_id: fundamental_quality_v1
            score_field: quality_score
            lower_is_better: false
            date_column: date
            symbol_column: symbol
            available_column: available
            mode: soft_weight
            factor_role: context
            apply_layer: candidate
