study_id: etf/cn_etf_beta_stabilizer_v2
title: CN ETF Beta Stabilizer V2
asset_scope: cn_etf
baseline_id: baseline_V10_2
hypothesis: 在 `510300/510050` 双宽基主池下，通过提升并持上限、显式 fallback 与 Governor 部署语义，验证 ETF sleeve 收益差是否主要由长期部署不足导致。
