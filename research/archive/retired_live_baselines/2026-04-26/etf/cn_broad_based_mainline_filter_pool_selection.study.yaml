  fast_mode: true
metadata:
  materialize_config_json: true
  template_id: cn_broad_based_mainline_filter_pool_selection
  policy_scope: broad_based_only
  excludes_sector_etf: true
  notes:
    - this study only targets broad-based and broad-style ETF mainline variants
    - sector ETF and thematic ETF are explicitly out of scope
    - governor boundary and ETF local exposure semantics are fixed controls
