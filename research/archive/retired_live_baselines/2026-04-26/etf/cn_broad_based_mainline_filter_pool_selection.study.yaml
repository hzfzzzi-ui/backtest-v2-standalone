  - name: FILTER_MA200_ONLY
    description: 只放松绝对过滤，改成 MA200 only；其余候选池、选择链路与主线控制组完全一致。
    config_patches:
      - path: governed_a_share.etf_beta.absolute_filter_profile
        value: ma200_only
      - path: governed_a_share.etf_beta.absolute_filter_mode
        value: ma200_only
  - name: FILTER_MA150_RET12
    description: 只把绝对过滤换成 MA150+12M>0；其余候选池、选择链路与主线控制组完全一致。
    config_patches:
      - path: governed_a_share.etf_beta.absolute_filter_profile
        value: ma150_ret12
      - path: governed_a_share.etf_beta.absolute_filter_mode
        value: ma150_and_positive_12m
  - name: POOL_PROXY_EXPANDED
    description: 只扩展候选池到 proxy expanded；其余过滤与选择链路保持控制组不变。
    config_patches:
      - path: governed_a_share.etf_beta.candidate_pool_profile
        value: proxy_expanded_pool
  - name: POOL_STANDARD_OVERLAP
    description: 只切换到 standard overlap 候选池；其余过滤与选择链路保持控制组不变。
    config_patches:
      - path: governed_a_share.etf_beta.candidate_pool_profile
        value: standard_overlap_pool
  - name: CHAIN_TOP2_6_3_1
    description: 只把排序链路切到 6/3/1 全局 Top2；其余过滤与候选池保持控制组不变。
    config_patches:
      - path: governed_a_share.etf_beta.selection_chain_profile
        value: global_top2_6_3_1
      - path: governed_a_share.etf_beta.relative_strength_fast_window
        value: 21
      - path: governed_a_share.etf_beta.relative_strength_mid_window
        value: 63
      - path: governed_a_share.etf_beta.relative_strength_slow_window
        value: 126
      - path: governed_a_share.etf_beta.relative_strength_fast_weight
        value: 0.2
      - path: governed_a_share.etf_beta.relative_strength_mid_weight
        value: 0.3
      - path: governed_a_share.etf_beta.relative_strength_slow_weight
        value: 0.5
  - name: CHAIN_CORE_GROWTH_SLOT
    description: 只把排序链路切到 core+growth 双槽位；其余过滤与候选池保持控制组不变。
    config_patches:
      - path: governed_a_share.etf_beta.selection_chain_profile
        value: core_growth_slot
