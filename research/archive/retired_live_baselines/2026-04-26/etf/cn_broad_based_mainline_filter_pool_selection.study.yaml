study_id: etf/cn_broad_based_mainline_filter_pool_selection
title: CN Broad Based ETF Mainline Filter Pool Selection
asset_scope: cn_etf
baseline_id: baseline_V10_2
hypothesis: 固定当前宽基 ETF 主线的 Governor/CTA 边界与本地暴露语义，只研究绝对过滤、候选池和选择链路三个主瓶颈；如果 ETF 主线收益上不去，应该先明确是过滤过严、候选池偏弱，还是排序链路把强 ETF 过滤掉了。
