study_id: etf/cn_etf_beta_dual_momentum_vol_target
title: CN ETF Beta Dual Momentum Vol Target
asset_scope: cn_etf
baseline_id: baseline_V10_2
hypothesis: 在 510300/510050 的 Dual Momentum 基础版上，通过 20D 或 30D realized vol 做无杠杆仓位缩放，观察是否能在不改变候选池和 fallback 的前提下改善回撤和波动表现。
