windows:
  - key: "1626"
    role: main
    start: "2016-11-04"
    end: "2026-03-24"
hard_gates: {}
required_outputs:
  - machine_bundle
  - human_bundle
request_template:
  config_path: outputs/baselines/baseline_V10_2/config.json
  fast_mode: true
metadata:
  materialize_config_json: true
  template_id: cn_broad_based_standalone_mainline
  policy_scope: broad_based_only
  excludes_sector_etf: true
  notes:
    - only broad-based and broad-style ETFs are allowed in this study
    - sector ETF and thematic ETF are explicitly out of scope
    - this study treats ETF as a governed standalone mainline, not an auxiliary beta sleeve
