study_id: etf/cn_broad_based_standalone_mainline
title: CN Broad Based ETF Standalone Mainline
asset_scope: cn_etf
baseline_id: baseline_V10_2
hypothesis: 在统一 Governor/CTA 真相下，将宽基 ETF 明确定义为独立宽基轮动主线而非辅助 beta sleeve，允许它使用自己的 enter/exit、deployability 与受控承接逻辑，有机会显著提升实际暴露连续性与独立 ETF CAGR。
change_scope:
  modules_modified:
    - research_entry.cn_etf.broad_based_standalone_mainline
metadata:
  formal_alignment_classification: do_not_promote
  formal_alignment_reference: A股ETF子系统策略思路md
  formal_alignment_reason_codes:
    - FORMAL_EXCLUDED_ASSET_USED::input_etfs::159915.SZ
    - FORMAL_EXCLUDED_ASSET_USED::input_etfs::511010.SH
    - SIGNAL_SEMANTICS_OUT_OF_SCOPE::local_policy_mode::broad_based_rotation_mainline
    - GOVERNOR_BOUNDARY_OUT_OF_SCOPE::source_entry_type::cn_etf_broad_based_standalone_mainline_entry
variants:
