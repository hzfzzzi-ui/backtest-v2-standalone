study_id: etf/cn_broad_based_governed_exposure_policy
title: CN Broad Based ETF Governed Exposure Policy
asset_scope: cn_etf
baseline_id: baseline_V10_2
hypothesis: 在同一 Governor 真相下，只研究宽基 ETF sleeve 的本地暴露翻译，验证 LIGHT 与受控 TRANS_DOWN 的分层承接和 fallback 语义，是否能让宽基 ETF 的目标/实际暴露更连续且仍保持可解释。
change_scope:
  modules_modified:
    - research_entry.cn_etf.broad_based_governed_exposure_policy
metadata:
  formal_alignment_classification: do_not_promote
  formal_alignment_reference: A股ETF子系统策略思路md
  formal_alignment_reason_codes:
    - FORMAL_EXCLUDED_ASSET_USED::input_etfs::159915.SZ
    - FORMAL_EXCLUDED_ASSET_USED::input_etfs::511010.SH
    - SIGNAL_SEMANTICS_OUT_OF_SCOPE::exposure_policy_family::broad_based_governed_v1
    - OUTPUT_CONTRACT_OUT_OF_SCOPE::template_proxy_map
variants:
  - name: CTRL_A0_TOP2_BOND
    description: 当前 A0 胜出版控制组，只保留宽基 ETF 范围与 511010 fallback，不启用新的 governed exposure policy。
    config_patches:
      - path: asset_scope
        value: cn_etf
      - path: universe_mode
        value: CUSTOM
      - path: industries
        value: []
      - path: universe.benchmark
        value: 510300.SH
      - path: universe.symbols
        value:
          - 510300.SH
          - 510500.SH
          - 512100.SH
          - 512890.SH
          - 159915.SZ
          - 511010.SH
      - path: universe.membership_mode
        value: ""
      - path: universe.price_adj
        value: none
      - path: universe.filters
        value:
          price_min: 0.0
          price_max: 99999.0
          atr_pct_range: "0,100"
          limit_rule: ignore
      - path: data_source.stocks_table
        value: pams_cn_etf_daily
      - path: data_source.data_role
        value: v1
      - path: governed_a_share.etf_beta.research_rule_family
        value: broad_based_rotation_template_a
      - path: governed_a_share.etf_beta.template_id
        value: broad_based_governed_exposure_policy
      - path: governed_a_share.etf_beta.template_asset_pool_version
        value: GBP_V1
      - path: governed_a_share.etf_beta.template_role_map
        value:
          510300.SH: hs300
          510500.SH: csi500
          512100.SH: csi1000_proxy
          512890.SH: dividend_proxy
          159915.SZ: growth_style
      - path: governed_a_share.etf_beta.template_proxy_map
        value:
          512100.SH: CSI1000_STANDARD
          512890.SH: DIVIDEND_STANDARD
      - path: governed_a_share.etf_beta.template_target_formal_symbols
        value:
          - 510300.SH
          - 510500.SH
          - CSI1000_STANDARD
          - DIVIDEND_STANDARD
          - 159915.SZ
      - path: governed_a_share.etf_beta.growth_seat_symbol
        value: 159915.SZ
      - path: governed_a_share.etf_beta.core_beta_symbols
        value:
          - 510300.SH
          - 510500.SH
          - 512100.SH
          - 512890.SH
          - 159915.SZ
      - path: governed_a_share.etf_beta.limited_defense_candidates
        value: []
      - path: governed_a_share.etf_beta.rebalance_frequency
        value: monthly
      - path: governed_a_share.etf_beta.absolute_filter_mode
        value: ma200_and_positive_12m
      - path: governed_a_share.etf_beta.fallback_mode
        value: single_symbol
      - path: governed_a_share.etf_beta.fallback_symbol
        value: 511010.SH
      - path: governed_a_share.etf_beta.relative_strength_fast_window
        value: 63
      - path: governed_a_share.etf_beta.relative_strength_mid_window
        value: 126
      - path: governed_a_share.etf_beta.relative_strength_slow_window
        value: 252
      - path: governed_a_share.etf_beta.relative_strength_fast_weight
        value: 0.2
      - path: governed_a_share.etf_beta.relative_strength_mid_weight
        value: 0.3
      - path: governed_a_share.etf_beta.relative_strength_slow_weight
        value: 0.5
      - path: governed_a_share.etf_beta.max_selected_symbols
        value: 2
      - path: governed_a_share.etf_beta.exposure_policy_family
        value: default
      - path: governed_a_share.etf_beta.policy_scope
        value: broad_based_only
      - path: governed_a_share.etf_beta.broad_based_only
        value: true
      - path: governed_a_share.etf_beta.layering_policy
        value: none
      - path: governed_a_share.etf_beta.target_exposure_by_state_5
        value:
          BULL: 1.0
