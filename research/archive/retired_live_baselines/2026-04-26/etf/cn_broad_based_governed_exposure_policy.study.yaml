          TRANS_UP: 0.5
          LIGHT: 0.25
          TRANS_DOWN: 0.0
          RISK_OFF: 0.0
      - path: governed_a_share.etf_beta.target_selected_count_by_state_5
        value:
          BULL: 2
          TRANS_UP: 2
          LIGHT: 1
          TRANS_DOWN: 0
          RISK_OFF: 0
      - path: governed_a_share.etf_beta.fallback_allowed_by_state_5
        value:
          BULL: true
          TRANS_UP: true
          LIGHT: true
          TRANS_DOWN: false
          RISK_OFF: false
