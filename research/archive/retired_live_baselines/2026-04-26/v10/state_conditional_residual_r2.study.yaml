study_id: v10/state_conditional_residual_r2
title: V10 State Conditional Residual R2
asset_scope: cn_a_equity
baseline_id: baseline_V10
hypothesis: Increase industry-relative residual weight only in strong risk-on states to reduce benchmark-anchor drag without changing the breakout execution path.
change_scope:
  modules_modified:
    - signal_generation.ranking.residual_benchmark_weight
    - signal_generation.ranking.residual_industry_weight
    - signal_generation.ranking.residual_weight_regime_mode
    - signal_generation.ranking.residual_benchmark_weight_fallback
    - signal_generation.ranking.residual_industry_weight_fallback
variants:
  - name: B0
  - name: R2_A_STRONG_IND_ONLY
    config_patches:
      - path: signal_generation.ranking.residual_benchmark_weight
        value: 0.0
      - path: signal_generation.ranking.residual_industry_weight
        value: 1.0
      - path: signal_generation.ranking.residual_weight_regime_mode
        value: STRONG_RISK_ON
      - path: signal_generation.ranking.residual_benchmark_weight_fallback
        value: 0.5
      - path: signal_generation.ranking.residual_industry_weight_fallback
        value: 0.5
  - name: R2_B_STRONG_B30_I70
    config_patches:
      - path: signal_generation.ranking.residual_benchmark_weight
        value: 0.3
      - path: signal_generation.ranking.residual_industry_weight
        value: 0.7
      - path: signal_generation.ranking.residual_weight_regime_mode
        value: STRONG_RISK_ON
      - path: signal_generation.ranking.residual_benchmark_weight_fallback
        value: 0.5
      - path: signal_generation.ranking.residual_industry_weight_fallback
        value: 0.5
