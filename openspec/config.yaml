schema: spec-driven

context: |
  你正在维护的项目是“个人多资产趋势配置系统”。
  当前主线目标不是继续堆功能，而是固化研发秩序、稳住系统边界、保持研究与执行合同可审计。

  当前正式主路径：
  - backend/api
  - backend/core
  - backend/research
  - frontend
  - research
  - tests
  - openspec

  当前桌面前端正式主链：
  - frontend/index.html
  - frontend/assets/js/desktop-shell/host.js
  - frontend/assets/js/desktop-shell/runtime-surface.js
  - frontend/assets/js/desktop-shell/app-shell.js
  - frontend/assets/js/desktop-shell/*
  - frontend/app/results-workbench/

  当前 unified combo 正式口径：
  - 组件来源真相：component_source_contract
  - 结果展示真相：comboTruth
  - 组件实验引用：config.component_experiments

  强制语言规则：
  - 与用户沟通、注释、README、spec、报告说明：全部使用中文
  - 代码变量/函数名使用英文

  核心工程原则：
  - 配置必须保持单一真相
  - 可观测性优先
  - 结果必须可复现
  - 禁止用展示逻辑反向污染研究口径

defaults:
  language:
    conversation: zh-CN
    documentation: zh-CN
    commit_message: zh-CN
  style:
    tone: 专业、直接、可执行
    verbosity: 中等
  workflow:
    spec_first: true
    always_include:
      - 目标与范围
      - 非目标
      - 接口/数据结构
      - 边界条件与失败模式
      - 验收标准
      - 回退方案
  reporting:
    timezone: America/Mexico_City
    date_format: YYYY-MM-DD
  safety:
    refuse_unsafe_trading_advice: true
    allow_research_backtest: true

rules:
  spec:
    - 必须用中文撰写
    - 涉及配置字段时，必须说明字段来源与运行时映射
    - 涉及风控/退出/过滤时，必须说明 reason_code、计数器或诊断产物
  tasks:
    - 每个任务都应包含 DoD、验证方式和风险点
    - 优先打通配置生效链路和可观测性，再做策略扩展
  code_patch:
    - 注释必须中文，命名英文
    - 变更必须最小化且可回退
    - 涉及运行参数时必须说明 run_meta 或产物变化
  report:
    - 回测报告必须中文
    - 报告时间轴使用 America/Mexico_City
  dataset_artifacts:
    - 产物字段必须给出 schema 与含义
    - 诊断 CSV 必须包含最小复现场景字段

preferences:
  python:
    formatting: black
    lint: ruff
    typing: pyright
    test: pytest
  js:
    formatting: prettier
    lint: eslint
    frontend_stack: keep_current
  git:
    conventional_commits: true
    branch_naming: feature/<topic>, fix/<topic>, exp/<topic>
  backtest_defaults:
    market: A股
    currency: CNY
    seed: 42
    timezone_data: Asia/Shanghai
    timezone_report: America/Mexico_City
